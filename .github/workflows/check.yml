name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One step runs every hub check (AC-14): detector matrix (public and synthetic rows; private rows skip without
      # matrix.local.json), probe and benchmark harnesses (offline: no credentials, no model, no docker), config and
      # trust tests, shell and Python 3.8 syntax, pack lint, the generic check and the plugin build check.
      # It continues past a failure, prints a summary, and exits 1 if any check failed.
      - name: Hub checks (scripts/test-all.sh)
        env:
          WORKFLOW_MATRIX_CACHE: ${{ runner.temp }}/workflow-matrix
        run: scripts/test-all.sh
