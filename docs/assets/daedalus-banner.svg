<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Daedalus</title>
  <desc id="desc">Daedalus, the plug-and-play dev workflow for Claude Code: Plan, Code, Review, QA.</desc>
  <defs>
    <radialGradient id="glow-gold" cx="0.12" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#F4C76A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4C76A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-sea" cx="0.88" cy="0.08" r="0.55">
