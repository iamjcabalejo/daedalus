      .chip { font: 700 18px ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; fill: #FFFFFF; letter-spacing: 3px; }
      .arrow { fill: none; stroke: #C8902E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
